name: Deploy Helper Bot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 212.38.89.129
          username: dev
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "index.js,package.json,package-lock.json,commands/**,utils/**,scripts/**,data/.gitkeep"
          target: "/home/dev/bot-ernas-helper"
          rm: false

      - name: Install and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 212.38.89.129
          username: dev
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ~/bot-ernas-helper
            npm install --omit=dev
            pm2 describe ernas-helper-bot >/dev/null && pm2 restart ernas-helper-bot || pm2 start index.js --name ernas-helper-bot
            pm2 save
